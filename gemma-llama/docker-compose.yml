# ============================================================================
# gemma-llama: two-container stack.
#   - llama: llama.cpp llama-server with auto-downloaded GGUF model.
#   - api:   FastAPI service that talks to llama via OpenAI-compatible API.
# ============================================================================

services:
  llama:
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
      args:
        GGML_CUDA: "OFF"
        # Pin to a tagged llama.cpp build that contains the April 2026 native
        # Gemma 4 audio merge. Override in .env to bump.
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-b8837}
        # ARM CPU baseline. Empty on x86_64 hosts (cmake auto-detect is fine);
        # the Dockerfile auto-fills `armv8.2-a+dotprod+i8mm+fp16` for arm64
        # builds (Pi 5 / Apple-silicon Linux) so Cortex-A76 gets the i8mm
        # matmul kernels. Override here to force a specific baseline
        # regardless of TARGETARCH (e.g. `armv8.2-a+dotprod` to disable i8mm
        # if the host toolchain miscompiles those kernels).
        GGML_CPU_ARM_ARCH: ${GGML_CPU_ARM_ARCH:-}
    image: gemma-llama/llama:cpu
    container_name: gemma-llama-llama
    restart: unless-stopped
    volumes:
      - ./models:/models
    environment:
      MODEL_DIR: /models
      MODEL_PATH: /models/model.gguf
      MMPROJ_PATH: /models/mmproj.gguf
      DRAFT_PATH: /models/draft.gguf
      MODEL_REPO: ${MODEL_REPO:-unsloth/gemma-4-E4B-it-GGUF}
      # Default to Q4_0 because llama.cpp's repacked dotprod SGEMM kernel
      # is the fastest matmul path on Pi 5 / Cortex-A76. Override to a
      # K-quant (e.g. Q4_K_M) on CUDA / Apple-silicon hosts.
      MODEL_FILE: ${MODEL_FILE:-gemma-4-E4B-it-Q4_0.gguf}
      # MMPROJ_* default to the official Google projector that ships inside
      # the Gemma 4 E4B GGUF repo (April 2026 release). Override with empty
      # strings if you want a text-only deployment.
      MMPROJ_REPO: ${MMPROJ_REPO:-unsloth/gemma-4-E4B-it-GGUF}
      # Default to F16 because Pi 5 / consumer CPUs have native FP16 but no
      # native BF16; the BF16 build up-converts to FP32 in software there.
      # Override to mmproj-BF16.gguf on CUDA / Apple-silicon hosts.
      MMPROJ_FILE: ${MMPROJ_FILE:-mmproj-F16.gguf}
      # On Pi 5 / CPU-only Macs we keep the projector resident on CPU. The
      # GPU compose override flips this to "true" alongside GPU_LAYERS=99.
      MMPROJ_USE_GPU: ${MMPROJ_USE_GPU:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 8080
      CONTEXT_SIZE: ${CONTEXT_SIZE:-8192}
      THREADS: ${THREADS:-4}
      # `--threads-batch`: prompt-eval thread pool. Empty = same as THREADS,
      # which is the right default on Pi 5 (4 cores; nothing to gain by
      # splitting). Set to a higher count on hosts with more cores if decode
      # latency matters more than prefill.
      THREADS_BATCH: ${THREADS_BATCH:-}
      # Prompt-batch tuning. Larger BATCH_SIZE improves prefill throughput on
      # multimodal prompts; UBATCH_SIZE controls the per-step micro-batch and
      # should be a divisor of BATCH_SIZE. Pi 5 defaults match llama.cpp
      # upstream; drop UBATCH_SIZE to 256 if your prefill thrashes L2.
      BATCH_SIZE: ${BATCH_SIZE:-2048}
      UBATCH_SIZE: ${UBATCH_SIZE:-512}
      GPU_LAYERS: ${GPU_LAYERS:-0}
      # Speculative decoding. OFF by default for Gemma 4 E4B because no
      # compatible draft model exists in stock llama.cpp (see .env.example
      # for the full rationale). Set DRAFT_REPO/DRAFT_FILE to opt in once a
      # compatible draft is available; the download_model.sh script picks
      # them up automatically and llama-server adds `--model-draft` only
      # when the file actually lands on disk.
      DRAFT_REPO: ${DRAFT_REPO:-}
      DRAFT_FILE: ${DRAFT_FILE:-}
      DRAFT_MAX: ${DRAFT_MAX:-8}
      DRAFT_MIN: ${DRAFT_MIN:-4}
      DRAFT_P_MIN: ${DRAFT_P_MIN:-0.75}
      # Decode-speed knobs (Pi 5 is memory-bandwidth bound). `-fa` enables
      # flash attention; q8_0 K/V cache halves KV-cache bandwidth with no
      # measurable quality loss. Setting FLASH_ATTN=false also forces the
      # V-cache back to the default to keep llama.cpp happy.
      FLASH_ATTN: ${FLASH_ATTN:-true}
      CACHE_TYPE_K: ${CACHE_TYPE_K:-q8_0}
      CACHE_TYPE_V: ${CACHE_TYPE_V:-q8_0}
      # mlock pins model weights in RAM so a memory-pressure spike (e.g. ffmpeg
      # decoding a video) cannot page them out under us. Pi 5 has 16 GB; the
      # weights are ~3 GB; safe and improves tail latency.
      MLOCK: ${MLOCK:-true}
    # MLOCK=true requires an unlimited RLIMIT_MEMLOCK inside the container;
    # the Docker daemon defaults are too small for a 4-5 GB GGUF on most
    # hosts. Setting -1 = unlimited unblocks llama-server's mlock(2) call.
    # Drop this if you set MLOCK=false.
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 3600s
      retries: 5
    expose:
      - "8080"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: gemma-llama/api:latest
    container_name: gemma-llama-api
    restart: unless-stopped
    depends_on:
      llama:
        condition: service_healthy
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      # Piper voice cache. ./voices is created on first run; subsequent
      # boots skip the download step entirely.
      - ./voices:/voices
      # WAV cache for the long-output `audio_url` shape. Bind-mounted (not
      # tmpfs) so the TTL janitor can outlive a container restart cleanly
      # while still being trivially throwable.
      - ./tts_outputs:/tmp/tts_outputs
    environment:
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-http://llama:8080}
      MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-model_configs/gemma4-e4b.yaml}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_RETRIES: ${LLM_RETRIES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Prompt-prefix cache opt-in. True = sets `cache_prompt: true` on every
      # /v1/chat/completions payload so byte-identical system prompts hit
      # llama.cpp's slot KV cache. Set to false only for benchmarking the
      # cold-start path.
      LLAMA_CACHE_PROMPT: ${LLAMA_CACHE_PROMPT:-true}
      # Edge media preprocessing. 896 = Gemma 4's native vision tile; drop to
      # 512 to make camera-driven prefill ~3x faster at the cost of fine OCR
      # detail. JPEG_QUALITY 88 keeps the re-encoded tile visually lossless.
      IMAGE_MAX_EDGE: ${IMAGE_MAX_EDGE:-896}
      IMAGE_JPEG_QUALITY: ${IMAGE_JPEG_QUALITY:-88}
      # ---- TTS (Piper) ----------------------------------------------------
      TTS_ENABLED: ${TTS_ENABLED:-true}
      PIPER_BINARY: ${PIPER_BINARY:-/usr/local/bin/piper}
      TTS_VOICES_DIR: ${TTS_VOICES_DIR:-/voices}
      TTS_OUTPUT_DIR: ${TTS_OUTPUT_DIR:-/tmp/tts_outputs}
      TTS_OUTPUT_TTL_SECONDS: ${TTS_OUTPUT_TTL_SECONDS:-600}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-warm-academic}
      TTS_VOICES_ENABLED: ${TTS_VOICES_ENABLED:-warm-academic,friendly-casual,neutral-news,energetic-kid,calm-storyteller}
      TTS_MAX_SENTENCE_CHARS: ${TTS_MAX_SENTENCE_CHARS:-400}
      TTS_MAX_CONCURRENCY: ${TTS_MAX_CONCURRENCY:-2}
      # Required by docker/download_voices.sh to fetch from gated repos.
      HF_TOKEN: ${HF_TOKEN:-}
