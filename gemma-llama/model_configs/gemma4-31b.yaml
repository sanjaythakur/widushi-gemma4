# Gemma 4 31B (dense). Largest member of the Gemma 4 family.
#
# Per the model card, 31B supports text + image only (no audio/video).
# Requires ~20 GB RAM at Q4_K_M or GPU offload; not for Raspberry Pi.

display_name: "Gemma 4 31B (it)"
short_name: "31B"

hf_repo: "unsloth/gemma-4-31B-it-GGUF"
hf_file: "gemma-4-31B-it-Q4_K_M.gguf"
mmproj_repo: "unsloth/gemma-4-31B-it-GGUF"
mmproj_file: "mmproj-BF16.gguf"

context_size: 16384
threads: 8
gpu_layers: 0

modalities:
  text: true
  image: true
  audio: false
  video: false

defaults:
  max_tokens: 1024
  temperature: 0.7
  # Off by default; /audio/listen exposes a per-request `thinking` field.
  thinking: false

# This config disables `modalities.audio`, so the four audio-bearing mode
# endpoints (`/free-convo/turn`, `/voice-mirror/score`, `/vision/teach-object`,
# `/audio/listen`) will return 409. Only `/voice-mirror/suggest` (text-only)
# is usable here.
#
# Prompts intentionally omitted -- defaults in app/model_config.py work.
