# Gemma 4 E2B (2B effective parameters). Lighter sibling of E4B.
#
# Use this config when you need to free RAM on the Pi 5. The April 2026
# Gemma 4 release ships the official Google vision/audio projector inside
# the unsloth/gemma-4-E2B-it-GGUF repo, so vision + audio (and thus all
# five Widushi mode endpoints) work out of the box.

display_name: "Gemma 4 E2B (it)"
short_name: "E2B"

hf_repo: "unsloth/gemma-4-E2B-it-GGUF"
hf_file: "gemma-4-E2B-it-Q4_0.gguf"
mmproj_repo: "unsloth/gemma-4-E2B-it-GGUF"
mmproj_file: "mmproj-F16.gguf"

context_size: 8192
threads: 4
gpu_layers: 0

modalities:
  text: true
  image: true
  audio: true
  video: false

defaults:
  max_tokens: 512
  temperature: 0.7
  # Default off on every mode endpoint -- chain-of-thought roughly doubles
  # decoded tokens on Pi 5 for the same final reply. /audio/listen exposes
  # a per-request `thinking` form field for harder spoken questions.
  thinking: false

# Prompts intentionally omitted -- the defaults in app/model_config.py work
# for all five mode endpoints. Override individual templates here under
# `prompts:` if needed.
