# Gemma 4 E4B (4B effective parameters). Default model.
#
# Fits comfortably in Pi 5 16 GB RAM at Q4_0. The April 2026 Gemma 4
# release ships the official Google vision/audio projector inside the
# unsloth/gemma-4-E4B-it-GGUF repo, so vision + audio (and thus all five
# Widushi mode endpoints) work out of the box. Q4_0 is preferred on Pi 5
# because it hits llama.cpp's repacked dotprod SGEMM kernel; switch to
# Q4_K_M on CUDA / Apple-silicon.

display_name: "Gemma 4 E4B (it)"
short_name: "E4B"

hf_repo: "unsloth/gemma-4-E4B-it-GGUF"
hf_file: "gemma-4-E4B-it-Q4_0.gguf"
mmproj_repo: "unsloth/gemma-4-E4B-it-GGUF"
mmproj_file: "mmproj-F16.gguf"

context_size: 8192
threads: 4
gpu_layers: 0

modalities:
  text: true
  image: true
  audio: true
  video: false

defaults:
  max_tokens: 512
  temperature: 0.7
  # Default off on every mode endpoint -- chain-of-thought roughly doubles
  # decoded tokens on Pi 5 for the same final reply. /audio/listen exposes
  # a per-request `thinking` form field for harder spoken questions.
  thinking: false

# Prompts intentionally omitted -- the defaults in app/model_config.py work
# for all five mode endpoints. Add an entry under `prompts:` here to override
# any of: free_convo, voice_mirror_suggest, voice_mirror_score, vision_teach,
# audio_listen.
