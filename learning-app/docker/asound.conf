# Widushi Pi audio routing.
#
# Pins ALSA's default playback to the USB speaker (card 1) and default
# capture to the USB mic (card 0) so any app that opens "default" lands
# on the correct device. SDL2/pygame and sounddevice both honour this.
#
# Verify card numbers on your Pi before installing:
#   aplay  -l       # playback cards (USB speaker should be one)
#   arecord -l      # capture cards (USB mic should be one)
#
# Adjust ``card`` numbers below if yours differ. Install with:
#   sudo make install-asound        # (from learning-app/)
# which runs ``cp docker/asound.conf /etc/asound.conf``.
#
# After install, restart any audio apps (or reboot) so their PCM
# handles re-resolve "default".

# Default playback target -> USB speaker.
pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm  "mic"
}

ctl.!default {
    type hw
    card 1
}

pcm.speaker {
    type plug
    slave {
        pcm "hw:1,0"
    }
}

pcm.mic {
    type plug
    slave {
        pcm "hw:0,0"
    }
}
