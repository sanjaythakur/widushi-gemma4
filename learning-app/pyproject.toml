[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "widushi-learning-app"
version = "0.2.0"
description = "Widushi: interactive Gemma-powered learning tutor on a Raspberry Pi 5."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "pydantic>=2",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "openwakeword>=0.6",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
widushi = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
